include "#!./gradlew -q desktopApp:printConveyorConfig"
include "/stdlib/jdk/21/amazon.conf"

app {
    machines = [windows.amd64, linux.amd64.glibc, linux.aarch64.glibc, mac.amd64, mac.aarch64]

    display-name = "Knock"
    fsname = "knock"
    vendor = "VKasurinen"
    description = "Knock Chat Application"
    rdns-name = "com.vkasurinen.knock"

    url-schemes = ["knock"]


    icons = "conveyorResources/logo.png"

    single-instance = true

    license = "MIT"
    copyright = "© 2026 VKasurinen"
    vcs-url = "https://github.com/VKasurinen/Knock"
    updates = none

    jvm {
        main-class = "com.vkasurinen.knock.MainKt"
        gui.main-class = "com.vkasurinen.knock.MainKt"

        version = 21

        options = [
            "-Xmx2g",
            "--add-opens=java.base/sun.misc=ALL-UNNAMED",
            "--add-opens=java.base/java.nio=ALL-UNNAMED",
            "--add-opens=java.desktop/sun.awt=ALL-UNNAMED",
            "--add-opens=java.desktop/sun.awt.wl=ALL-UNNAMED",
            "--add-opens=java.desktop/sun.awt.X11=ALL-UNNAMED",
        ]


        modules = [
            detect,
            java.desktop,
            java.logging,
            java.management,
            java.prefs,
            java.sql,
            jdk.crypto.ec,
            jdk.unsupported
        ]
    }

    mac {
        info-plist {
            "com.apple.developer.associated-domains" = [
                "applinks:knock.vkasurinen.com"
            ]
            NSMicrophoneUsageDescription = "Knock uses the microphone to record voice messages."
        }
    }

    windows {
        // Conveyor always builds an MSIX and an EXE installer and adds a Start menu entry.
        // Without a code signing certificate the packages are self-signed.
        console = false

        // Opens https://knock.vkasurinen.com links in the app, like the Android app links. Windows only
        // allows it when the domain serves /.well-known/windows-app-web-link for this app.
        manifests.msix.extensions-xml = """
            <uap3:Extension xmlns:uap3="http://schemas.microsoft.com/appx/manifest/uap/windows10/3" Category="windows.appUriHandler">
                <uap3:AppUriHandler>
                    <uap3:Host Name="knock.vkasurinen.com" />
                </uap3:AppUriHandler>
            </uap3:Extension>
        """
    }

    linux {
        // Conveyor generates the .desktop file for the applications menu, these keys are added to it
        desktop-file."Desktop Entry" {
            Categories = "Network;Chat;InstantMessaging;"
            Keywords = "chat;messaging;knock;"
        }
    }
}

conveyor {
    compatibility-level = 19
    billing-email = "vaino.kasurinen@hotmail.fi"
}
